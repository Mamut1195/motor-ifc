[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "motor-ifc"
dynamic = ["version"]
description = "Deterministic, policy-gated IFC compiler for MAMUT authority snapshots"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "MAMUT" }]
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
ifc = ["ifcopenshell==0.8.5"]
ids = ["ifcopenshell==0.8.5", "ifctester==0.8.5"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[project.scripts]
motor-ifc-sidecar = "motor_ifc.rpc:main"
motor-ifc-supervisor = "motor_ifc.supervisor:main"
motor-ifc-schemas = "motor_ifc.schemas:main"

[tool.hatch.version]
path = "src/motor_ifc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_ifc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["ifcopenshell: integration requiring the optional IfcOpenShell dependency", "ids: integration requiring the optional IDS dependency"]
